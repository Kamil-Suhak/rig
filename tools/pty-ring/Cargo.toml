[package]
name = "pty-ring"
version = "0.1.0"
edition = "2021"
description = "Transparent PTY ring-buffer shim for Ghostty using OSC 133 slicing"

[dependencies]
nix = { version = "0.29", features = ["fs", "ioctl", "poll", "process", "signal", "term"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.15"
vte = "0.15"
