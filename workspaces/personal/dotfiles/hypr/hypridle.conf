general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Server mode Peek re-blank (re-turns display off after 25s of idle when in server mode)
listener {
    timeout = 25
    on-timeout = test -f "/run/user/$(id -u)/server-mode" && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 240
    on-timeout = test ! -f "/run/user/$(id -u)/server-mode" && brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
